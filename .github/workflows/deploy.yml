name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.86.177.195
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            bash /opt/proxy/deploy.sh
