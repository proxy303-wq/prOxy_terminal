name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.86.177.195
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pin the host key. The value that used to be here was the server's ED25519
          # key, but the action's SSH client negotiates RSA first, so every run since
          # 2026-09-10 failed with "host key fingerprint mismatch" - deploys stopped
          # silently and the VPS drifted a day behind (2026-09-11). Verify with:
          #   ssh-keyscan -t rsa 103.86.177.195 | ssh-keygen -lf -
          fingerprint: SHA256:oAKE6Ckuoxhp4MknmJydbAcvrJayr8Mj/zKFBUmc9vA
          script: |
            bash /opt/proxy/deploy/deploy.sh
