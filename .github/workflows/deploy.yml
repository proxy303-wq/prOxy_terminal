name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 103.86.177.195
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pin the host key. Until 2026-09-11 this held the server's ED25519 key,
          # but the action's SSH client negotiates ECDSA, so EVERY run since the pin
          # was added failed with "host key fingerprint mismatch": deploys stopped
          # silently and the VPS drifted a day behind (it was updated by hand).
          # ED25519 and RSA were both tried and both failed; this ECDSA value is
          # verified working. If the host is ever rebuilt, re-derive it with:
          #   ssh-keyscan -t ecdsa 103.86.177.195 2>/dev/null | ssh-keygen -lf -
          fingerprint: SHA256:py7d/FELAVSwqMfmqmDrzyep5ScJGLrgqeprPu2BY28
          script: |
            bash /opt/proxy/deploy/deploy.sh
